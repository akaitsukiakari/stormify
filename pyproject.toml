[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stormify"
version = "0.1.0"
description = "Alerts-forward weather notifications: NWS alerts filtered your way, pushed to your phone, archived in a dashboard."
readme = "README.md"
requires-python = ">=3.11"
# Pure-Python dependencies only, so everything installs on a Raspberry Pi Zero W (armv6).
dependencies = [
    "requests>=2.28",
    "flask>=2.3",
    "waitress>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
stormify = "stormify.cli:main"

[tool.setuptools.packages.find]
include = ["stormify*"]

[tool.setuptools.package-data]
"stormify" = ["examples/*.json"]
"stormify.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
